name: kind
topology:
  groups:
    frr:
      kind: linux
      image: quay.io/frrouting/frr:10.6.0
      binds:
        - ../../clab/frrcommon/daemons:/etc/frr/daemons
        - ../../clab/frrcommon/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv6.conf.all.forwarding=1
    agnhost:
      kind: linux
      image: "k8s.gcr.io/e2e-test-images/agnhost:2.40"
      cmd: netexec --http-port=8090

  nodes:
    leafA:
      group: frr
      binds:
        - ../../clab/leafA/frr.conf:/etc/frr/frr.conf
        - ../../clab/leafA/setup.sh:/setup.sh
    leafB:
      group: frr
      binds:
        - ../../clab/leafB/frr.conf:/etc/frr/frr.conf
        - ../../clab/leafB/setup.sh:/setup.sh
    leafkind1:
      group: frr
      binds:
        - ../../clab/singlecluster/leafkind1/frr.conf:/etc/frr/frr.conf
    leafkind2:
      group: frr
      binds:
        - ../../clab/singlecluster/leafkind2/frr.conf:/etc/frr/frr.conf
    spine:
      group: frr
      binds:
        - ../../clab/singlecluster/spine/frr.conf:/etc/frr/frr.conf

    hostA_default:
      group: agnhost
      binds:
        - ../../clab/hostA_default/setup.sh:/setup.sh
    hostA_red:
      group: agnhost
      binds:
        - ../../clab/hostA_red/setup.sh:/setup.sh
    hostB_red:
      group: agnhost
      binds:
        - ../../clab/hostB_red/setup.sh:/setup.sh
    hostA_blue:
      group: agnhost
      binds:
        - ../../clab/hostA_blue/setup.sh:/setup.sh
    hostB_blue:
      group: agnhost
      binds:
        - ../../clab/hostB_blue/setup.sh:/setup.sh
    leafSRV6:
      group: frr
      binds:
        - ../../clab/leafSRV6/frr.conf:/etc/frr/frr.conf
        - ../../clab/leafSRV6/setup.sh:/setup.sh
    hostSRV6_red:
      group: agnhost
      binds:
        - ../../clab/hostSRV6_red/setup.sh:/setup.sh
    hostSRV6_blue:
      group: agnhost
      binds:
        - ../../clab/hostSRV6_blue/setup.sh:/setup.sh

    dhcp1:
      kind: linux
      image: alpine:3.20
      binds:
        - ../../clab/singlecluster/dhcp1/dnsmasq.sh:/dnsmasq.sh
      cmd: /dnsmasq.sh

    # Bridge nodes reference pre-existing libvirt bridges created by dev-scripts
    # via EXTRA_NETWORK_NAMES="toswitch1 toswitch2".
    toswitch1:
      kind: bridge

    toswitch2:
      kind: bridge

  links:
    - endpoints: ["leafA:eth1", "spine:eth1"]
    - endpoints: ["leafB:eth1", "spine:eth2"]
    - endpoints: ["leafkind1:eth1", "spine:eth3"]
    - endpoints: ["leafkind2:eth1", "spine:eth4"]
    - endpoints: ["leafA:ethred", "hostA_red:eth1"]
    - endpoints: ["leafA:ethdefault", "hostA_default:eth1"]
    - endpoints: ["leafA:ethblue", "hostA_blue:eth1"]
    - endpoints: ["leafB:ethred", "hostB_red:eth1"]
    - endpoints: ["leafB:ethblue", "hostB_blue:eth1"]
    - endpoints: ["leafSRV6:eth1", "spine:ethsrv6"]
    - endpoints: ["leafSRV6:ethred", "hostSRV6_red:eth1"]
    - endpoints: ["leafSRV6:ethblue", "hostSRV6_blue:eth1"]
    - endpoints: ["dhcp1:eth1", "toswitch1:dhcp1"]
    - endpoints: ["leafkind1:toswitch1", "toswitch1:lk1"]
    - endpoints: ["leafkind2:toswitch2", "toswitch2:lk2"]
