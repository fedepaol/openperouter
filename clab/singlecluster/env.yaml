name: singlecluster
topology_file: kind.clab.yml

allocation:
  link_subnet_base_v4: "192.168.1.0/24"
  link_subnet_base_v6: "fd00:1::/48"
  broadcast_subnet_base_v4: "192.168.11.0/24"
  broadcast_subnet_base_v6: "fd00:11::/48"
  vtep_base: "100.64.0.0/24"
  router_id_base: "10.200.0.0/24"

node_groups:
  - pattern: "leaf[AB]"
    role: edge
    asn: 64520
    bgp:
      ipv4: true
      ipv6: false
      evpn: true
      bfd: false
    vrfs:
      - name: red
        vni: 100
      - name: blue
        vni: 200

  - pattern: "spine"
    role: transit
    asn: 64612
    bgp:
      ipv4: true
      ipv6: false
      evpn: true

  - pattern: "leafkind"
    role: edge
    asn: 64512
    bgp:
      ipv4: true
      ipv6: false
      evpn: true

  - pattern: "host.*"
    role: edge
    asn: 0
    bgp:
      ipv4: false

  - pattern: "leafkind-switch"
    role: transit
    asn: 0
    bgp:
      ipv4: false

  - pattern: "pe-kind.*"
    role: transit
    asn: 0
    bgp:
      ipv4: false
